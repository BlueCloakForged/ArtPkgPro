<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ArtPkg Intake</title>
  <style>
    :root { color-scheme: light; font-family: Inter, Segoe UI, Arial, sans-serif; background:#f6f7f9; color:#17202a; }
    body { margin:0; }
    header { padding:18px 24px; border-bottom:1px solid #d8dee6; background:#fff; display:flex; align-items:center; justify-content:space-between; gap:16px; }
    h1 { font-size:20px; margin:0; letter-spacing:0; }
    main { display:grid; grid-template-columns:320px 1fr; min-height:calc(100vh - 65px); }
    aside { border-right:1px solid #d8dee6; background:#fff; padding:18px; }
    section { padding:18px 22px; }
    label { display:block; font-weight:650; margin-bottom:8px; }
    input[type=file], textarea, select { width:100%; box-sizing:border-box; border:1px solid #b8c2cc; border-radius:6px; padding:10px; background:#fff; }
    textarea { min-height:84px; resize:vertical; font-family:Consolas, monospace; font-size:12px; }
    .check { display:flex; align-items:flex-start; gap:8px; font-size:13px; line-height:1.35; }
    .check input { margin-top:2px; }
    button { border:1px solid #8795a5; background:#fff; border-radius:6px; padding:8px 11px; cursor:pointer; width:auto; justify-self:start; white-space:nowrap; }
    button:disabled { cursor:not-allowed; opacity:0.55; }
    button.primary { background:#174ea6; border-color:#174ea6; color:#fff; }
    button.danger { border-color:#b42318; color:#b42318; }
    .stack { display:grid; gap:12px; }
    .sidebar-actions { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .review-toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin:0 0 14px; }
    .review-toolbar-text { color:#52606d; font-size:13px; line-height:1.35; max-width:620px; }
    .queue-tabs { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 16px; }
    .queue-tabs button[aria-pressed=true] { background:#17202a; color:#fff; }
    .card { border:1px solid #d8dee6; border-radius:8px; background:#fff; padding:14px; display:grid; gap:8px; }
    .meta { color:#52606d; font-size:12px; }
    .guidance { border-left:3px solid #2f6f5e; background:#eef7f3; padding:10px 12px; display:grid; gap:6px; font-size:13px; line-height:1.4; }
    .guidance-title { font-weight:700; color:#183d34; }
    .guidance-row { display:grid; gap:2px; }
    .field-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:8px; }
    .field-note { border:1px solid #d8dee6; border-radius:6px; padding:8px; background:#fff; display:grid; gap:4px; }
    .field-note strong { font-size:13px; }
    .answer-controls { display:grid; grid-template-columns:minmax(220px, 1fr) 190px auto; gap:8px; align-items:end; }
    .answer-controls label { margin:0; font-size:12px; color:#52606d; }
    .value { white-space:pre-wrap; background:#f6f7f9; border-radius:6px; padding:10px; font-family:Consolas, monospace; font-size:12px; }
    .projection-link { display:inline-flex; align-items:center; width:max-content; border:1px solid #174ea6; border-radius:6px; background:#174ea6; color:#fff; font-weight:700; text-decoration:none; padding:8px 11px; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; }
    .status { font-size:13px; color:#52606d; }
    iframe { width:100%; min-height:560px; border:1px solid #d8dee6; border-radius:8px; background:#fff; }
    @media (max-width: 860px) { main { grid-template-columns:1fr; } aside { border-right:0; border-bottom:1px solid #d8dee6; } .answer-controls { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>ArtPkg Intake</h1>
    <div class="status" id="status">No session loaded</div>
  </header>
  <main>
    <aside class="stack">
      <div>
        <label for="preArtifactsFile">Pre-artifacts file</label>
        <input id="preArtifactsFile" type="file" accept=".md,.markdown,.txt">
      </div>
      <label class="check">
        <input id="restrictedAck" type="checkbox">
        <span>I have checked this local upload for secrets, credentials, regulated data, and restricted content handling.</span>
      </label>
      <div class="sidebar-actions">
        <button class="primary" id="upload">Start questionnaire</button>
      </div>
      <div id="sessionMeta" class="status"></div>
    </aside>
    <section>
      <div class="review-toolbar">
        <div class="review-toolbar-text">You can answer items now, or visualize unresolved areas first.</div>
        <button class="primary" id="visualizeGaps">Visualize gaps</button>
      </div>
      <div class="queue-tabs" id="queueTabs"></div>
      <div class="stack" id="reviewQueues"></div>
      <div class="stack" id="projectionArea"></div>
    </section>
  </main>
  <script>
    let session = null;
    let activeQueue = "needs_answer";
    const labels = {
      needs_answer: "Needs answer",
      needs_confirmation: "Needs confirmation",
      authority_sensitive: "Authority-sensitive",
      evidence_sensitive: "Evidence-sensitive",
      ready_for_quick_review: "Ready"
    };

    function setStatus(text) { document.getElementById("status").textContent = text; }

    async function postJson(url, payload) {
      const response = await fetch(url, { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify(payload) });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Request failed");
      return data;
    }

    function appendText(parent, tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      element.textContent = text;
      parent.appendChild(element);
      return element;
    }

    function renderQuestionContext(card, item) {
      const question = item.question || {};
      const guidance = document.createElement("div");
      guidance.className = "guidance";
      appendText(guidance, "div", "guidance-title", `${question.group || "Questionnaire"} - ${question.answer_type || "Answer"}`);
      appendText(guidance, "div", "", question.group_description || "Provide enough context to make this package reviewable.");
      const meaning = document.createElement("div");
      meaning.className = "guidance-row";
      appendText(meaning, "strong", "", "What this means");
      appendText(meaning, "span", "", question.meaning || "Answer this explicitly, or mark it unknown/deferred when that is truthful.");
      guidance.appendChild(meaning);
      if (question.example) {
        const example = document.createElement("div");
        example.className = "guidance-row";
        appendText(example, "strong", "", "Example");
        appendText(example, "span", "", question.example);
        guidance.appendChild(example);
      }
      if ((question.choices || []).length) {
        appendText(guidance, "div", "meta", `Allowed choices: ${question.choices.join(", ")}`);
      }
      card.appendChild(guidance);
    }

    function renderRecordContext(card, item) {
      const context = item.record_context || {};
      const guidance = document.createElement("div");
      guidance.className = "guidance";
      appendText(guidance, "div", "guidance-title", `${context.label || item.label || "Record"} - ${context.group || "Repeated record"}`);
      appendText(guidance, "div", "", context.group_description || "Review each seeded field before accepting the record into the package.");
      const fields = document.createElement("div");
      fields.className = "field-grid";
      (item.record_schema || []).forEach((field) => {
        const note = document.createElement("div");
        note.className = "field-note";
        appendText(note, "strong", "", field.label || field.name);
        appendText(note, "span", "", field.meaning || "Provide a specific, reviewable value.");
        if ((field.choices || []).length) appendText(note, "span", "meta", `Choices: ${field.choices.join(", ")}`);
        fields.appendChild(note);
      });
      if (fields.childElementCount) guidance.appendChild(fields);
      card.appendChild(guidance);
    }

    function actionPayload(item) {
      return item.kind === "record"
        ? { session_dir:session.session_dir, record_id:item.id, reviewer:"UI reviewer" }
        : { session_dir:session.session_dir, question_id:item.id, reviewer:"UI reviewer" };
    }

    function actionUrl(item, action) {
      if (item.kind === "record") return `/api/session/record/${action}`;
      return action === "confirm" ? "/api/session/confirm" : "/api/session/reject";
    }

    function render() {
      if (!session) return;
      document.getElementById("sessionMeta").textContent = `Session: ${session.session_id}`;
      const tabs = document.getElementById("queueTabs");
      tabs.innerHTML = "";
      Object.keys(labels).forEach((name) => {
        const button = document.createElement("button");
        button.textContent = `${labels[name]} (${session.queue_counts[name] || 0})`;
        button.setAttribute("aria-pressed", String(activeQueue === name));
        button.onclick = () => { activeQueue = name; render(); };
        tabs.appendChild(button);
      });

      const list = document.getElementById("reviewQueues");
      list.innerHTML = "";
      (session.review_queues[activeQueue] || []).forEach((item) => {
        const card = document.createElement("article");
        card.className = "card";
        appendText(card, "strong", "", `${item.id} ${item.label || ""}`);
        appendText(card, "div", "meta", `${item.reason || ""} | ${item.state || ""} | ${item.source_type || ""} | confidence ${item.confidence_score ?? "n/a"}`);
        if (item.kind === "answer") renderQuestionContext(card, item);
        if (item.kind === "record") renderRecordContext(card, item);
        appendText(card, "div", "value", typeof item.value === "string" ? item.value : JSON.stringify(item.value, null, 2));

        if (item.kind === "answer") {
          const controls = document.createElement("div");
          controls.className = "answer-controls";
          const answerWrap = document.createElement("div");
          appendText(answerWrap, "label", "", "Human answer");
          const answerBox = document.createElement("textarea");
          answerBox.value = typeof item.value === "string" && item.value !== "UNKNOWN" ? item.value : "";
          answerBox.placeholder = "Human answer";
          answerWrap.appendChild(answerBox);
          const stateWrap = document.createElement("div");
          appendText(stateWrap, "label", "", "Answer state");
          const stateSelect = document.createElement("select");
          ["PROVIDED", "UNKNOWN", "DEFERRED", "TO_BE_INSPECTED", "NOT_APPLICABLE"].forEach((state) => {
            const option = document.createElement("option");
            option.value = state;
            option.textContent = state;
            option.selected = state === (item.state === "UNKNOWN" ? "PROVIDED" : item.state || "PROVIDED");
            stateSelect.appendChild(option);
          });
          stateWrap.appendChild(stateSelect);
          const answerButton = document.createElement("button");
          answerButton.dataset.action = "answer";
          answerButton.textContent = "Save answer";
          answerButton.onclick = async () => {
            try {
              session = await postJson("/api/session/answer", {
                session_dir:session.session_dir,
                question_id:item.id,
                value:answerBox.value,
                state:stateSelect.value,
                reviewer:"UI reviewer"
              });
              setStatus("Answer saved");
              render();
            } catch (error) {
              setStatus(`Answer failed: ${error.message}`);
            }
          };
          controls.appendChild(answerWrap);
          controls.appendChild(stateWrap);
          controls.appendChild(answerButton);
          card.appendChild(controls);
        }

        const actions = document.createElement("div");
        actions.className = "actions";
        const confirmButton = document.createElement("button");
        confirmButton.dataset.action = "confirm";
        confirmButton.textContent = "Confirm";
        confirmButton.onclick = async () => {
          try {
            session = await postJson(actionUrl(item, "confirm"), actionPayload(item));
            setStatus(`${item.kind === "record" ? "Record" : "Answer"} confirmed`);
            render();
          } catch (error) {
            setStatus(`Confirm failed: ${error.message}`);
          }
        };
        const rejectButton = document.createElement("button");
        rejectButton.dataset.action = "reject";
        rejectButton.className = "danger";
        rejectButton.textContent = "Reject";
        rejectButton.onclick = async () => {
          const reason = prompt("Why is this seeded item rejected?") || "Rejected in UI";
          try {
            session = await postJson(actionUrl(item, "reject"), { ...actionPayload(item), reason });
            setStatus(`${item.kind === "record" ? "Record" : "Answer"} rejected`);
            render();
          } catch (error) {
            setStatus(`Reject failed: ${error.message}`);
          }
        };
        actions.appendChild(confirmButton);
        actions.appendChild(rejectButton);
        card.appendChild(actions);
        list.appendChild(card);
      });
    }

    document.getElementById("upload").onclick = async () => {
      const file = document.getElementById("preArtifactsFile").files[0];
      if (!file) { setStatus("Choose a pre-artifacts file first"); return; }
      if (!document.getElementById("restrictedAck").checked) { setStatus("Confirm local restricted-content handling before upload"); return; }
      const body = new FormData();
      body.append("file", file);
      setStatus("Creating intake session");
      const response = await fetch("/api/intake", { method:"POST", body });
      session = await response.json();
      if (!response.ok) { setStatus(session.error || "Upload failed"); return; }
      setStatus("Session ready");
      render();
    };

    async function buildProjection() {
      if (!session) { setStatus("Start a session first"); return; }
      setStatus("Visualizing gaps");
      try {
        session = await postJson("/api/session/project", { session_dir:session.session_dir });
        const area = document.getElementById("projectionArea");
        area.innerHTML = "";
        const card = document.createElement("article");
        card.className = "card";
        appendText(card, "strong", "", "Visualization ready");
        if (session.projection.html_path) {
          const link = document.createElement("a");
          link.className = "projection-link";
          link.href = `/api/session/projection-html?dir=${encodeURIComponent(session.session_dir)}`;
          link.target = "_blank";
          link.rel = "noopener";
          link.textContent = "Open visualization";
          card.appendChild(link);
          appendText(card, "div", "meta", `HTML: ${session.projection.html_path}`);
        }
        area.appendChild(card);
        setStatus("Visualization ready");
        render();
      } catch (error) {
        setStatus(`Visualization failed: ${error.message}`);
      }
    }

    document.getElementById("visualizeGaps").onclick = buildProjection;
  </script>
</body>
</html>
